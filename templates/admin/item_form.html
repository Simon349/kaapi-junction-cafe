{% extends "admin/admin_base.html" %}
{% block title %}{{ 'Edit' if item else 'Add' }} Menu Item — Admin{% endblock %}

{% block admin_content %}
<div class="admin-topbar">
  <h1>{{ 'Edit' if item else 'Add' }} Menu Item</h1>
  <a href="{{ url_for('admin_menu') }}" class="btn btn-outline-dark btn-small">← Back to list</a>
</div>

<div class="admin-panel" style="max-width: 640px;">
  <form method="POST">
    <div class="form-group">
      <label for="name">Item name</label>
      <input type="text" id="name" name="name" required value="{{ item.name if item else '' }}">
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" placeholder="Short, one-line description">{{ item.description if item else '' }}</textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="price">Price (₹)</label>
        <input type="number" step="1" min="0" id="price" name="price" required value="{{ item.price if item else '' }}">
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <input type="text" id="category" name="category" required list="cat-suggestions" value="{{ item.category if item else '' }}">
        <datalist id="cat-suggestions">
          <option value="Filter Kaapi">
          <option value="Espresso Classics">
          <option value="Cold Brews">
          <option value="Bakes & Bites">
        </datalist>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="sort_order">Sort order within category</label>
        <input type="number" id="sort_order" name="sort_order" value="{{ item.sort_order if item else 0 }}">
      </div>
      <div class="form-group">
        <label>Flags</label>
        <label style="font-weight: 400; display:flex; align-items:center; gap:8px; margin-top:8px;">
          <input type="checkbox" name="is_special" style="width:auto;" {% if item and item.is_special %}checked{% endif %}> Mark as today's special
        </label>
        <label style="font-weight: 400; display:flex; align-items:center; gap:8px; margin-top:8px;">
          <input type="checkbox" name="is_available" style="width:auto;" {% if not item or item.is_available %}checked{% endif %}> Available on menu
        </label>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">{{ 'Save Changes' if item else 'Add Item' }}</button>
  </form>
</div>
{% endblock %}
